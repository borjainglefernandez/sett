name: Sett
options:
  bundleIdPrefix: com.borjainglefernandez
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  SettCore:
    path: SettCore
targets:
  Sett:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - SettTests
    sources:
      - path: Sett
      - path: Shared
    dependencies:
      - package: SettCore
      - target: SettWidgets
    entitlements:
      path: Sett/Sett.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: Sett/Info.plist
      properties:
        CFBundleDisplayName: sett
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: "sett tags workouts with the gym you're at and finds Time Chambers nearby."
        BGTaskSchedulerPermittedIdentifiers:
          - com.borjainglefernandez.sett.refresh
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLSchemes: [sett]
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        GENERATE_INFOPLIST_FILE: false
  SettTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SettTests
    dependencies:
      - target: Sett
      - package: SettCore
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Sett.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Sett"
        BUNDLE_LOADER: "$(TEST_HOST)"

  SettWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: SettWidgets
      - path: Shared
    info:
      path: SettWidgets/Info.plist
      properties:
        CFBundleDisplayName: Sett Rest
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        GENERATE_INFOPLIST_FILE: false
        PRODUCT_BUNDLE_IDENTIFIER: com.borjainglefernandez.Sett.RestWidgets
